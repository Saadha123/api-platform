# LLM SDK Test Suite Configuration
# ----------------------------------
# Copy this file to config.yaml and fill in your values.
# Create providers/proxies in the AI workspace UI first, then fill in
# the IDs and gateway-generated API keys here.
#
# Usage:
#   cp config.yaml.example config.yaml
#   # edit config.yaml
#   pytest tests/

# ── Global ────────────────────────────────────────────────────────────────────

# Set to true to skip TLS certificate verification (for dev gateways with
# self-signed certs).
verify_ssl: false

# ── Providers ─────────────────────────────────────────────────────────────────
# For each provider:
#   enabled   - set to true to run tests for this provider
#   base_url  - the full URL the SDK should use as its base.
#               Tip: this is your gateway URL + the context you set in the UI.
#               For OpenAI-compatible providers include /v1 at the end.
#   api_key   - the API key generated by the AI workspace for this provider
#   models    - list of model IDs to test (tests are run once per model)

providers:

  azure_openai:
    enabled: true
    base_url: "https://localhost:8443/azure-openai"
    api_key: "b91ec50a3abc3cf8305a01cdbd2074072e92f92ed490b43ce931dcb4d2b3e092"
    api_version: "2024-06-01"
    models:
      - "apim-4o-mini"   # Azure deployment name (the SDK uses this as the deployment in the URL)

  openai:
    enabled: true
    base_url: "https://localhost:8443/openai/v1"
    api_key: "b26a2a98201795a158cadc14000c8a4648d573d3f6eae5f87b3f076504d496e2"
    models:
      - "gpt-4.1-nano"

  anthropic:
    enabled: true
    base_url: "https://localhost:8443/anthropic-provider"
    api_key: "354ad173eac8c13d152a5d0ee6bceddc2e9436e7c5669ae032bed4feea508d56"
    models:
      - "claude-sonnet-4-5"
      - "claude-opus-4-6"

  mistral:
    enabled: true
    base_url: "https://localhost:8443/mistral-provider"
    api_key: "33f0836da083699b18037ee0130455acbef314cabc0b32d43076491794027864"
    models:
      - "mistral-small-latest"

  gemini:
    enabled: true
    base_url: "https://localhost:8443/gemini"
    api_key: "bd511b398de07acb0189f50debd0d1fe415a6321866a3db1e4cc0b0b7d2ad439"
    models:
      - "gemini-3-flash-preview"
#      - "gemini-2.5-pro"

  # AWS Bedrock: the gateway authenticates the client with api_key and uses
  # its own AWS credentials upstream.  boto3 is configured with unsigned
  # requests so it does not add AWS SigV4; the gateway API key is injected
  # via the X-API-Key header instead.
#  bedrock:
#    enabled: false
#    base_url: "https://<gateway-host>/<provider-context>"
#    api_key: "gw_..."
#    region: "us-east-1"
#    models:
#      - "amazon.titan-text-premier-v1:0"
#      - "anthropic.claude-v2"
#


# ── Proxies ───────────────────────────────────────────────────────────────────
# Each proxy entry represents one LLM proxy created in the AI workspace.
# provider_type controls which SDK / request format the test uses.
# Valid provider_type values: openai, azure_openai, anthropic, gemini, mistral,
#                              bedrock, meta

proxies:
  - name: "Mistral Proxy"
    enabled: true
    provider_type: "mistral"
    base_url: "https://localhost:8443/mistral-proxy"
    api_key: "b9df5b0666d10f291a1c991a9a514d7f31d557815a38ed1d8b94d11168e3d62b"
    models:
      - "mistral-small-latest"

  - name: "Anthropic Proxy"
    enabled: true
    provider_type: "anthropic"
    base_url: "https://localhost:8443/anthropic-proxy"
    api_key: "21dc0518792ec5796c719d5455f6afe500ce2c39d1a5da2220136d4fba274a16"
    models:
      - "claude-sonnet-4-5"
      - "claude-opus-4-6"

  - name: "Gemini Proxy"
    enabled: true
    provider_type: "gemini"
    base_url: "https://localhost:8443/gemini-proxy"
    api_key: "9e4b9dc651058774137784af0c1a0081062380cde0053a854ad18aad9c3af3ea"
    models:
      - "gemini-3-flash-preview"

  - name: "OpenAI Proxy"
    enabled: true
    provider_type: "openai"
    base_url: "https://localhost:8443/openai-proxy/v1"
    api_key: "88c2aee97a70dc9b70ffd2ef8261992c06fc4c0358855a3d6ea2f0d740bbeb7a"
    models:
      - "gpt-4.1-nano"

  - name: "Azure OpenAI Proxy"
    enabled: true
    provider_type: "azure_openai"
    base_url: "https://localhost:8443/azure-openai-proxy"
#    base_url: "https://10.100.8.108:8443/azure-openai-proxy"
    api_key: "e08ac8580bad6d2156a2e7f492514bfe64b2c3fa966132e133d1d5c5cb235995"
    api_version: "2024-06-01"
    models:
      - "apim-4o-mini"
